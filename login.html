<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disney+</title>
    <link rel="stylesheet" href="login.css">
    <link rel="shortcut icon" href="images/disney.PNG" type="image/x-icon">
</head>
<body>
    <!-- Image Container -->
    <div class="image-container">
        <img src="/images/OIP (2).svg" alt="">
        <button onclick="document.getElementById('loginModal').style.display='block'" class="login-btn">Login</button>
        <button onclick="document.getElementById('signUpModal').style.display='block'" class="signup-btn">Sign Up</button>
    </div>

    <!-- Login Modal -->
    <div id="loginModal" class="modal">
        <div class="modal-content">
            <span onclick="document.getElementById('loginModal').style.display='none'" class="close">&times;</span>
            <form id="loginForm">
                <div class="container">
                    <label for="loginUsername"><b>Username</b></label>
                    <input type="text" id="loginUsername" placeholder="Enter Username" required><br><br>

                    <label for="loginPassword"><b>Password</b></label>
                    <input type="password" id="loginPassword" placeholder="Enter Password" required><br><br>

                    <button type="submit">Login</button>

                    <label>
                        <input type="checkbox" checked="checked" name="remember">Remember me
                    </label>
                </div>
            </form>
            <div class="container" style="background-color:#e7e7e8">
                <button type="button" onclick="document.getElementById('loginModal').style.display='none'" class="cancelbtn">Cancel</button>
                <span class="psw">Forgot <a href="#">password?</a></span>
            </div>
        </div>
    </div>

    <!-- Sign-Up Modal -->
    <div id="signUpModal" class="modal">
        <div class="modal-content">
            <span onclick="document.getElementById('signUpModal').style.display='none'" class="close">&times;</span>
            <form id="registerForm">
                <div class="container">
                    <label for="regUsername"><b>Username</b></label>
                    <input type="text" id="regUsername" placeholder="Enter Username" required><br><br>

                    <label for="regPassword"><b>Password</b></label>
                    <input type="password" id="regPassword" placeholder="Enter Password" required><br><br>

                    <label for="signUpEmail"><b>Email</b></label>
                    <input type="email" id="signUpEmail" placeholder="Enter Email" required><br><br>

                    <button type="submit">Sign Up</button>

                    <label>
                        <input type="checkbox" checked="checked" name="remember">Remember me
                    </label>
                </div>
            </form>
            <div class="container" style="background-color:#e7e7e8">
                <button type="button" onclick="document.getElementById('signUpModal').style.display='none'" class="cancelbtn">Cancel</button>
                <span class="psw">Forgot <a href="#">password?</a></span>
            </div>
        </div>
    </div>

    <!-- Placeholder for success message -->
    <div id="message"></div>

    <script src="login.js"></script>
</body>
</html>
